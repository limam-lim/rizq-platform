<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>دليل الوكالات العقارية — رزق</title>
<script>
(function(){
  try{
    if(localStorage.getItem('rizq_lang') === 'fr'){
      document.documentElement.lang = 'fr';
      document.documentElement.dir = 'ltr';
      document.title = 'Annuaire des agences immobilières — Rizq';
    }
  }catch(e){}
  location.replace('rizq_estate_agencies.html');
})();
</script>
<meta http-equiv="refresh" content="0;url=rizq_estate_agencies.html"/>
</head>
<body>
<p style="font-family:sans-serif;padding:24px;text-align:center">
  <a id="est-dir-redirect" href="rizq_estate_agencies.html">← دليل الوكالات العقارية</a>
</p>
<script>
(function(){
  try{
    if(localStorage.getItem('rizq_lang') === 'fr'){
      var a = document.getElementById('est-dir-redirect');
      if(a) a.textContent = '← Annuaire des agences immobilières';
    }
  }catch(e){}
})();
</script>
</body>
</html>
