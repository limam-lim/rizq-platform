<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="X-Content-Type-Options" content="nosniff"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="stylesheet" href="rizq-theme.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="rizq_header.css?v=31.6"/>
<script>document.documentElement.classList.add('rizq-app-nav')</script>
<title>دليل الوكالات العقارية — رزق</title>
<style>
:root{
  --navy:#1B3A6B;--navy2:#0F2347;--gold:#C9A84C;--gold2:#E8C96A;
  --dark:#0D1B2A;--white:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  background:linear-gradient(180deg,#eef2f8 0%,#f7f9fc 40%,#fff 100%);
  color:#26303F;min-height:100vh;
}
button,a,[role="button"]{cursor:pointer}
img{display:block;max-width:100%}

/* نفس منطق دليل المحلات: الهيدر الموحّد فقط — بدون شريط مكرّر */
html.rizq-app-nav.has-rizq-desk-nav .ag-hero,
html.rizq-app-nav:has(#rizq-desk-nav) .ag-hero{padding-top:16px}

.ag-hero{
  position:relative;overflow:hidden;text-align:center;
  padding:28px 4% 24px;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%,rgba(201,168,76,.18),transparent 55%),
    linear-gradient(165deg,#071020 0%,#0f2347 48%,#1B3A6B 100%);
}
.ag-hero::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;
  background-image:radial-gradient(rgba(201,168,76,.12) 1px,transparent 1px);
  background-size:20px 20px;
}
.ag-hero-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.ag-kicker{
  display:inline-block;margin:0 0 6px;padding:3px 10px;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--gold2);border:1px solid rgba(201,168,76,.35);background:rgba(201,168,76,.1);
}
.ag-hero h1{
  font-family:'Amiri',Georgia,'Times New Roman',serif;
  color:#fff;font-size:clamp(22px,3vw,30px);font-weight:700;line-height:1.2;
  margin-bottom:4px;text-shadow:0 2px 16px rgba(0,0,0,.3);
}
.ag-hero h1 span{
  background:linear-gradient(135deg,#F0D78A,#C9A84C,#E8C96A);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ag-sub{
  color:rgba(255,255,255,.78);font-size:13px;font-weight:600;
  max-width:520px;margin:0 auto 16px;line-height:1.55;
}

.ag-own-wrap{
  max-width:480px;margin:0 auto;padding:6px 8px;border-radius:12px;
  background:linear-gradient(165deg,#0D1B2A 0%,#152a4a 55%,#1B3A6B 100%);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 4px 14px rgba(8,15,30,.28);
}
.ag-own-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:10px 14px;border-radius:10px;text-decoration:none;
  font-family:'Cairo',sans-serif;font-size:13px;font-weight:900;line-height:1.3;
  color:#0D1B2A;background:#fff;border:1px solid rgba(255,255,255,.85);
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  transition:transform .2s,box-shadow .2s,background .2s;
}
.ag-own-btn:hover{transform:translateY(-1px);background:#f5f8fc;box-shadow:0 4px 14px rgba(0,0,0,.16)}

.ag-wrap{max-width:1180px;margin:0 auto;padding:14px 4% 56px}

.ag-filter-bar{
  margin:0 0 12px;padding:10px 12px;border-radius:14px;
  background:linear-gradient(180deg,#fff,#f8fafc);
  border:1px solid rgba(27,58,107,.08);
  box-shadow:0 4px 14px rgba(15,35,65,.04);
}
.ag-filter-label{
  font-size:11px;font-weight:800;color:#1B3A6B;letter-spacing:.3px;
  margin-bottom:8px;text-align:center;
}
.ag-cats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ag-cat-chip{
  padding:5px 11px;border-radius:10px;background:#fff;
  border:1.5px solid rgba(27,58,107,.12);color:#1B3A6B;
  font-size:12px;font-weight:700;transition:all .2s;
  cursor:pointer;font-family:inherit;box-shadow:0 1px 0 rgba(15,35,65,.04);
}
.ag-cat-chip:hover{border-color:rgba(201,168,76,.55);color:#0f2347;transform:translateY(-1px)}
.ag-cat-chip.active{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border-color:transparent;color:#0f2347;
  box-shadow:0 4px 14px rgba(201,168,76,.35);
}

.ag-toolbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;
  padding:10px;border-radius:12px;background:#fff;
  border:1px solid rgba(27,58,107,.08);box-shadow:0 4px 12px rgba(15,35,65,.04);
}
.ag-search{
  flex:1 1 220px;min-width:160px;background:#f7f9fc;border:1.5px solid #e2e8f5;
  border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;
}
.ag-search:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(201,168,76,.14)}
.ag-wilaya{
  flex:0 1 200px;min-width:140px;background:#f7f9fc;border:1.5px solid #e2e8f5;
  border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;
}
.ag-wilaya:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(201,168,76,.14)}
.ag-count{font-size:12.5px;color:#5b6b85;margin-bottom:12px;font-weight:700}

.ag-grid{
  display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
}
@media(max-width:560px){.ag-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}}

.ag-card{
  background:#fff;border:1.5px solid rgba(27,58,107,.08);border-radius:14px;padding:14px;
  text-decoration:none;color:inherit;transition:all .25s;display:flex;flex-direction:column;gap:5px;
  box-shadow:0 4px 12px rgba(15,35,65,.04);
}
.ag-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(27,58,107,.12);border-color:rgba(201,168,76,.55)}
.ag-card.is-example{border-style:dashed;border-color:rgba(201,168,76,.45)}
.ag-card-top{display:flex;align-items:center;gap:10px}
.ag-thumb{
  width:44px;height:44px;border-radius:11px;
  background:linear-gradient(145deg,#234d8f,#0f2347);display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--gold);flex-shrink:0;overflow:hidden;
  border:1px solid rgba(201,168,76,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.ag-thumb img{width:100%;height:100%;object-fit:cover}
.ag-name{font-size:14.5px;font-weight:800;color:#16263d;line-height:1.25}
.ag-type{font-size:11px;color:#a07820;font-weight:700}
.ag-example-badge{
  display:inline-block;margin-inline-start:6px;padding:1px 7px;border-radius:6px;
  font-size:9.5px;font-weight:800;background:rgba(201,168,76,.18);color:#8a6a1a;
}
.ag-city{font-size:12px;color:#5b6b85;display:flex;align-items:center;gap:4px}
.ag-tagline{font-size:12px;color:#7a8aa0;line-height:1.5;margin-top:1px}
.ag-cta{
  margin-top:4px;font-size:12px;font-weight:800;color:#0f2347;
  display:inline-flex;align-items:center;gap:5px;
}

.ag-empty{
  grid-column:1/-1;text-align:center;padding:28px 16px;border-radius:14px;
  border:1px dashed rgba(27,58,107,.18);background:#fff;color:#5b6b85;font-weight:700;font-size:13px;
}
.ag-examples-label{
  grid-column:1/-1;margin:2px 0 4px;text-align:center;
  font-size:12px;font-weight:800;color:#1B3A6B;letter-spacing:.3px;
}

.ag-foot{
  text-align:center;padding:18px 20px 28px;color:#64748b;font-size:12px;font-weight:700;
  border-top:1px solid rgba(27,58,107,.08);background:#fff;
}
.ag-foot a{color:var(--navy);text-decoration:none;font-weight:800}

@media(max-width:720px){
  .ag-hero{padding:18px 3% 16px}
  .ag-own-btn{font-size:12px;padding:9px 12px}
}
@media(prefers-reduced-motion:reduce){
  .ag-own-btn,.ag-card{transition:none}
}
</style>
<script src="rizq_pwa.js" defer></script>
</head>
<body>

<section class="ag-hero" aria-label="دليل الوكالات العقارية">
  <div class="ag-hero-inner">
    <p class="ag-kicker" id="ag-kicker">رزق · سوق العقارات</p>
    <h1 id="ag-title">دليل <span>الوكالات العقارية</span></h1>
    <p class="ag-sub" id="ag-sub">وكالات موثوقة بهوية واضحة — اختر وكالة وافتح صفحتها.</p>
    <div class="ag-own-wrap" data-rizq-estate-promo="1">
      <a class="ag-own-btn" id="ag-reg-own" href="rizq_real_estate_register.html">✨ امتلك وكالتك العقارية على رزق</a>
    </div>
  </div>
</section>

<main class="ag-wrap">
  <div class="ag-filter-bar">
    <p class="ag-filter-label" id="ag-filter-label">تصفية حسب النشاط</p>
    <div class="ag-cats" id="ag-cats" role="tablist"></div>
  </div>
  <div class="ag-toolbar">
    <input class="ag-search" id="ag-search" type="search" placeholder="ابحث بالاسم أو المدينة…" autocomplete="off"/>
    <select class="ag-wilaya" id="ag-wilaya" aria-label="الولاية">
      <option value="">كل الولايات</option>
      <option value="نواكشوط">نواكشوط</option>
      <option value="تفرغ زينة">تفرغ زينة</option>
      <option value="نواذيبو">نواذيبو</option>
      <option value="لكصر">لكصر</option>
      <option value="أطار">أطار</option>
      <option value="كيفة">كيفة</option>
      <option value="روصو">روصو</option>
    </select>
  </div>
  <div class="ag-count" id="ag-count" aria-live="polite"></div>
  <div class="ag-grid" id="ag-list" role="list" aria-label="قائمة الوكالات العقارية"></div>
</main>

<footer class="ag-foot">
  <span id="ag-foot-copy">© 2026 رزق —</span>
  <a id="ag-foot-dir" href="rizq_directory.html">دليل الأعمال</a>
  <span id="ag-demo-sep" data-rizq-estate-promo="1"> · </span>
  <a id="ag-demo-link" data-rizq-estate-promo="1" href="rizq_estate.html?demo=1&amp;id=demo_estate_atwar">نموذج وكالة</a>
</footer>

<script>
(function(){
  var CITY_FR = {
    'نواكشوط':'Nouakchott','تفرغ زينة':'Tevragh Zeina','نواذيبو':'Nouadhibou',
    'لكصر':'Ksar','أطار':'Atar','كيفة':'Kiffa','روصو':'Rosso'
  };
  var DEMO = [
    {
      id: 'demo_estate_atwar',
      name: 'أطوار للعقارات', nameFr: 'Atwar Immobilier',
      activity: 'وساطة عقارية', activityFr: 'Courtage immobilier',
      city: 'نواكشوط', cityFr: 'Nouakchott',
      tagline: 'فلل وشقق وأراضي', taglineFr: 'Villas, appartements et terrains',
      logo: 'rizq-mark-inset.png?v=1',
      badge: 'نموذج', badgeFr: 'Modèle',
      href: 'rizq_estate.html?demo=1&id=demo_estate_atwar'
    },
    {
      id: 'demo_estate_saknia',
      name: 'سكنية العقارية', nameFr: 'Saknia Immobilier',
      activity: 'بيع وإيجار', activityFr: 'Vente & location',
      city: 'تفرغ زينة', cityFr: 'Tevragh Zeina',
      tagline: 'شقق عائلية ومحلات', taglineFr: 'Appartements familiaux et locaux',
      logo: 'rizq-mark-inset.png?v=1',
      badge: 'نموذج', badgeFr: 'Modèle',
      href: 'rizq_estate.html?demo=1&id=demo_estate_saknia'
    },
    {
      id: 'demo_estate_horizon',
      name: 'هورايزن للإسكان', nameFr: 'Horizon Habitat',
      activity: 'تطوير ووساطة', activityFr: 'Promotion & courtage',
      city: 'نواذيبو', cityFr: 'Nouadhibou',
      tagline: 'أراضي وفلل جاهزة', taglineFr: 'Terrains et villas prêts',
      logo: 'rizq-mark-inset.png?v=1',
      badge: 'نموذج', badgeFr: 'Modèle',
      href: 'rizq_estate.html?demo=1&id=demo_estate_horizon'
    },
    {
      id: 'demo_estate_dar',
      name: 'دار الأمين العقارية', nameFr: 'Dar Al-Amine Immobilier',
      activity: 'إدارة عقارات', activityFr: 'Gestion immobilière',
      city: 'لكصر', cityFr: 'Ksar',
      tagline: 'إدارة كراء وبيع', taglineFr: 'Gestion locative et vente',
      logo: 'rizq-mark-inset.png?v=1',
      badge: 'نموذج', badgeFr: 'Modèle',
      href: 'rizq_estate.html?demo=1&id=demo_estate_dar'
    }
  ];

  var CATS = [
    { id: 'all', ar: 'الكل', fr: 'Tous', ico: '✦' },
    { id: 'وساطة', ar: 'وساطة', fr: 'Courtage', ico: '🏠' },
    { id: 'بيع', ar: 'بيع وإيجار', fr: 'Vente & location', ico: '🔑' },
    { id: 'تطوير', ar: 'تطوير', fr: 'Développement', ico: '🏗️' },
    { id: 'إدارة', ar: 'إدارة', fr: 'Gestion', ico: '📋' }
  ];

  var agencies = DEMO.slice();
  var hasLiveAgencies = false;
  var catFilter = 'all';
  var grid = document.getElementById('ag-list');
  var countEl = document.getElementById('ag-count');
  var searchEl = document.getElementById('ag-search');
  var wilayaEl = document.getElementById('ag-wilaya');
  var catsEl = document.getElementById('ag-cats');

  function esc(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  }

  function isFrAg(){
    try{
      var ls = localStorage.getItem('rizq_lang');
      if(ls === 'fr') return true;
      if(ls === 'ar') return false;
    }catch(e){}
    return document.documentElement.lang === 'fr';
  }

  function demoShowcaseAllowed(){
    if(window.RizqAccount && typeof window.RizqAccount.demoDashboardAllowed === 'function'){
      return !!window.RizqAccount.demoDashboardAllowed();
    }
    try{
      if(window.__RIZQ_ALLOW_DEMO_DASH === true) return true;
      if(window.__RIZQ_ALLOW_DEMO_DASH === false) return false;
      if(window.RIZQ_PUBLIC_CONFIG && window.RIZQ_PUBLIC_CONFIG.demoDashboardAllowed === false) return false;
      if(window.RIZQ_PUBLIC_CONFIG && window.RIZQ_PUBLIC_CONFIG.production === true) return false;
      var h = String(location.hostname || '').toLowerCase();
      if(h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h.endsWith('.local')) return true;
    }catch(e){}
    return false;
  }

  function hidePromoExplain(){
    var hide = hasLiveAgencies || !demoShowcaseAllowed();
    document.body.classList.toggle('rizq-estate-live', hide);
    document.querySelectorAll('[data-rizq-estate-promo]').forEach(function(el){
      el.style.display = hide ? 'none' : '';
    });
  }

  function matchCat(a, catId){
    if(catId === 'all') return true;
    var act = String(a.activity || '').toLowerCase();
    if(catId === 'وساطة') return /وساط|courtage|broker|realestate|عقارية/.test(act) && !/تطوير|إدارة|بيع/.test(act);
    if(catId === 'بيع') return /بيع|إيجار|location|vente/.test(act);
    if(catId === 'تطوير') return /تطوير|develop/.test(act);
    if(catId === 'إدارة') return /إدارة|gestion|manage/.test(act);
    return true;
  }

  function renderCats(){
    var fr = isFrAg();
    catsEl.innerHTML = CATS.map(function(c){
      var on = catFilter === c.id ? ' active' : '';
      return '<button type="button" class="ag-cat-chip'+on+'" data-cat="'+esc(c.id)+'" role="tab" aria-selected="'+(catFilter===c.id?'true':'false')+'">'
        + '<span aria-hidden="true">'+c.ico+' </span>'+(fr ? c.fr : c.ar)
        + '</button>';
    }).join('');
    catsEl.querySelectorAll('.ag-cat-chip').forEach(function(btn){
      btn.addEventListener('click', function(){
        catFilter = btn.getAttribute('data-cat') || 'all';
        renderCats();
        render();
      });
    });
  }

  function cardHTML(a, isExample){
    var fr = isFrAg();
    var href = a.href || ('rizq_estate.html?id=' + encodeURIComponent(a.id||''));
    var name = fr ? (a.nameFr || a.name) : a.name;
    var act = fr
      ? (a.activityFr || a.activity || 'Agence immobilière')
      : (a.activity || 'وكالة عقارية');
    var city = fr
      ? (a.cityFr || CITY_FR[a.city] || a.city || '')
      : (a.city || '');
    var tagline = fr ? (a.taglineFr || a.tagline || '') : (a.tagline || '');
    var openLbl = fr ? 'Visiter l\'agence ←' : 'زيارة الوكالة ←';
    var badge = a.badge;
    if(fr){
      if(badge === 'نموذج') badge = a.badgeFr || 'Modèle';
      else if(badge === 'موثّق' || badge === 'موثق') badge = 'Vérifié';
      else if(a.badgeFr) badge = a.badgeFr;
    }
    var thumb = a.logo
      ? '<img src="'+esc(a.logo)+'" alt="" loading="lazy"/>'
      : '🏠';
    return '<a class="ag-card'+(isExample?' is-example':'')+'" role="listitem" href="'+esc(href)+'">'
      + '<div class="ag-card-top">'
      +   '<div class="ag-thumb">'+thumb+'</div>'
      +   '<div>'
      +     '<div class="ag-name">'+esc(name)
      +       (badge ? ' <span class="ag-example-badge">'+esc(badge)+'</span>' : '')
      +     '</div>'
      +     '<div class="ag-type">'+esc(act)+'</div>'
      +   '</div>'
      + '</div>'
      + (city ? '<div class="ag-city">📍 '+esc(city)+'</div>' : '')
      + (tagline ? '<div class="ag-tagline">'+esc(tagline)+'</div>' : '')
      + '<span class="ag-cta">'+openLbl+'</span>'
      + '</a>';
  }

  function filtered(){
    var q = (searchEl.value||'').trim().toLowerCase();
    var w = (wilayaEl.value||'').trim();
    return agencies.filter(function(a){
      if(!matchCat(a, catFilter)) return false;
      if(w && String(a.city||'').indexOf(w) < 0) return false;
      if(!q) return true;
      return ((a.name||'')+' '+(a.city||'')+' '+(a.activity||'')+' '+(a.tagline||'')).toLowerCase().indexOf(q) >= 0;
    });
  }

  function render(){
    var list = filtered();
    var fr = isFrAg();
    var showingExamples = !hasLiveAgencies && demoShowcaseAllowed() && list.length;
    countEl.textContent = list.length
      ? (fr ? (list.length + ' agence' + (list.length > 1 ? 's' : '')) : ('عرض '+list.length+' وكالة'))
      : (fr ? 'Aucune agence correspondante' : 'لا وكالات مطابقة');

    if(!list.length){
      grid.innerHTML = '<div class="ag-empty">'+(fr
        ? ('Aucune agence pour l\'instant — élargissez la recherche'+(hasLiveAgencies?'': ' ou inscrivez votre agence')+'.')
        : ('لا وكالات مطابقة حالياً — جرّب بحثاً أوسع'+(hasLiveAgencies?'': ' أو سجّل وكالتك')+'.'))+'</div>';
      return;
    }

    var html = '';
    if(showingExamples){
      html += '<div class="ag-examples-label">'+(fr ? 'Exemples de présentation' : 'أمثلة لشكل العرض')+'</div>';
    }
    html += list.map(function(a){ return cardHTML(a, showingExamples); }).join('');
    grid.innerHTML = html;
  }

  function isEstateAgency(a){
    if(!a || a.type !== 'office') return false;
    var act = String(a.activityId || a.activity || a.category || a.sector || '').toLowerCase();
    if(/realestate|of_realestate|عقار|immobilier|estate/.test(act)) return true;
    if(window.RizqMerchantActivities && typeof RizqMerchantActivities.accountMatchesDirectoryFilter === 'function'){
      try { return !!RizqMerchantActivities.accountMatchesDirectoryFilter(a, 'office', 'realestate'); } catch(e){}
    }
    return false;
  }

  function mapAccount(a){
    var city = a.city || a.wilaya || a.location || '';
    return {
      id: a.id,
      name: a.name || 'وكالة عقارية',
      nameFr: a.nameFr || a.name || 'Agence immobilière',
      activity: a.activity || a.sector || 'وساطة عقارية',
      activityFr: a.activityFr || a.sectorFr || 'Courtage immobilier',
      city: city,
      cityFr: a.cityFr || CITY_FR[city] || city,
      tagline: a.tagline || a.bio || '',
      taglineFr: a.taglineFr || a.bioFr || a.tagline || a.bio || '',
      logo: a.logo || a.avatar || 'rizq-mark-inset.png?v=1',
      badge: a.verified ? 'موثّق' : '',
      badgeFr: a.verified ? 'Vérifié' : '',
      href: 'rizq_estate.html?id=' + encodeURIComponent(a.id||'')
    };
  }

  function backendBase(){
    if (typeof window.RIZQ_BACKEND_BASE === 'string' && window.RIZQ_BACKEND_BASE) {
      return String(window.RIZQ_BACKEND_BASE).replace(/\/$/, '');
    }
    try { if (location && location.origin) return location.origin; } catch (e) {}
    return 'http://localhost:3000';
  }

  function loadLive(){
    fetch(backendBase() + '/api/accounts/public', { credentials: 'omit' })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var list = Array.isArray(rows) ? rows : (rows && rows.accounts) || [];
        var live = list.filter(isEstateAgency).map(mapAccount);
        if(live.length){
          hasLiveAgencies = true;
          agencies = live;
        } else if(!demoShowcaseAllowed()){
          hasLiveAgencies = false;
          agencies = [];
        } else {
          hasLiveAgencies = false;
          agencies = DEMO.slice();
        }
        hidePromoExplain();
        render();
      })
      .catch(function(){
        if(!demoShowcaseAllowed()){
          agencies = [];
          hasLiveAgencies = false;
        }
        hidePromoExplain();
        render();
      });
  }

  function bindReg(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('click', function(e){
      if(typeof window.openRegisterAs === 'function'){
        e.preventDefault();
        window.openRegisterAs('estate');
      } else {
        e.preventDefault();
        location.href = 'rizq_real_estate_register.html';
      }
    });
  }

  var __agLangBusy = false;
  function applyAgenciesLang(){
    if(__agLangBusy) return;
    __agLangBusy = true;
    try{
      var fr = isFrAg();
      var wantLang = fr ? 'fr' : 'ar';
      var wantDir = fr ? 'ltr' : 'rtl';
      if(document.documentElement.lang !== wantLang) document.documentElement.lang = wantLang;
      if(document.documentElement.getAttribute('dir') !== wantDir) document.documentElement.setAttribute('dir', wantDir);

      function setTxt(id, ar, frTxt){
        var el = document.getElementById(id);
        if(el) el.textContent = fr ? frTxt : ar;
      }
      setTxt('ag-kicker', 'رزق · سوق العقارات', 'Rizq · Marché immobilier');
      var title = document.getElementById('ag-title');
      if(title) title.innerHTML = fr
        ? 'Annuaire des <span>agences immobilières</span>'
        : 'دليل <span>الوكالات العقارية</span>';
      setTxt('ag-sub',
        'وكالات موثوقة بهوية واضحة — اختر وكالة وافتح صفحتها.',
        'Agences de confiance — choisissez une agence et ouvrez sa page.');
      setTxt('ag-filter-label', 'تصفية حسب النشاط', 'Filtrer par activité');
      setTxt('ag-reg-own', '✨ امتلك وكالتك العقارية على رزق', '✨ Possédez votre agence sur Rizq');
      setTxt('ag-demo-link', 'نموذج وكالة', 'Agence modèle');
      setTxt('ag-foot-copy', '© 2026 رزق —', '© 2026 Rizq —');
      setTxt('ag-foot-dir', 'دليل الأعمال', 'Annuaire des entreprises');
      document.title = fr ? 'Annuaire des agences immobilières — Rizq' : 'دليل الوكالات العقارية — رزق';

      var hero = document.querySelector('.ag-hero');
      if(hero) hero.setAttribute('aria-label', fr ? 'Annuaire des agences immobilières' : 'دليل الوكالات العقارية');
      wilayaEl.setAttribute('aria-label', fr ? 'Wilaya' : 'الولاية');

      searchEl.placeholder = fr ? 'Rechercher une agence ou une ville…' : 'ابحث بالاسم أو المدينة…';
      if(wilayaEl && wilayaEl.options){
        for(var wi = 0; wi < wilayaEl.options.length; wi++){
          var opt = wilayaEl.options[wi];
          var v = opt.value;
          if(!v){ opt.textContent = fr ? 'Toutes les wilayas' : 'كل الولايات'; }
          else { opt.textContent = fr ? (CITY_FR[v] || v) : v; }
        }
      }
      var listLabel = document.getElementById('ag-list');
      if(listLabel) listLabel.setAttribute('aria-label', fr ? 'Liste des agences immobilières' : 'قائمة الوكالات العقارية');

      renderCats();
      render();
    } finally { __agLangBusy = false; }
  }

  searchEl.addEventListener('input', render);
  wilayaEl.addEventListener('change', render);
  bindReg('ag-reg-own');
  if(!demoShowcaseAllowed()){
    agencies = [];
  }
  hidePromoExplain();
  applyAgenciesLang();
  document.addEventListener('rizq:langchange', applyAgenciesLang);
  renderCats();
  render();
  loadLive();
})();
</script>
