<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4080"/>
      <stop offset="1" stop-color="#080f1e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D878"/>
      <stop offset="0.5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#9A7020"/>
    </linearGradient>
  </defs>
  <!-- خلفية مستديرة الزوايا -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- حد ذهبي خافت -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#C9A84C" stroke-opacity="0.28" stroke-width="4"/>
  <!-- R كبيرة يسار -->
  <text x="158" y="348" font-family="Georgia,serif" font-size="290" font-weight="700" fill="url(#gold)" text-anchor="middle">R</text>
  <!-- ر عربية يمين أصغر -->
  <text x="352" y="342" font-family="DejaVu Sans,serif" font-size="180" font-weight="700" fill="url(#gold)" text-anchor="middle" opacity="0.9">&#x631;</text>
</svg>