<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>

<title>تفاصيل المناقصة — رزق</title>
<style>
:root{
  --navy:#1B3A6B;--navy2:#0F2347;--gold:#C9A84C;--gold2:#E8C96A;--gold-dk:#8a6c1f;
  --dark:#0D1B2A;--paper:#F6F4EE;--ink:#1C2536;--ink-soft:#5B6478;--line:#E7E2D6;
  --danger:#B23A2E;--ok:#0E6E4E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',system-ui,sans-serif;background:linear-gradient(180deg,#eef2f8 0%,#f8faff 45%,#fff 100%);color:var(--ink);min-height:100vh}
.topnav{display:none!important}
.detail-hero{
  position:relative;overflow:hidden;padding:36px 5% 28px;text-align:center;
  background:radial-gradient(ellipse 1100px 640px at 50% -8%,#1a2744 0%,#0c1220 50%,#060a12 100%);
}
.detail-hero::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:conic-gradient(from 210deg at 50% 0%,transparent 0deg,rgba(201,168,76,.16) 10deg,transparent 22deg);
}
.detail-hero-inner{position:relative;z-index:1;max-width:760px;margin:0 auto}
.detail-kicker{font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#E8C96A;margin-bottom:10px}
.detail-hero h1{
  font-family:Georgia,'Amiri',serif;font-size:clamp(22px,3.4vw,34px);font-weight:700;color:#fff;line-height:1.35;margin:0 0 10px;
}
.detail-hero p{font-size:14px;color:rgba(255,255,255,.78);line-height:1.7;max-width:560px;margin:0 auto}
.detail-crumb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.detail-crumb a{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:700;
  text-decoration:none;background:rgba(255,255,255,.06);color:#E8C96A;border:1px solid rgba(201,168,76,.35);
}
.wrap{max-width:820px;margin:0 auto;padding:28px 5% 70px}
.gate-card,.detail-card{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 24px;
  box-shadow:0 1px 2px rgba(20,30,55,.04),0 12px 32px rgba(20,30,55,.07);
  animation:rise .45s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.gate-card{text-align:center}
.gate-card .ico{font-size:42px;margin-bottom:12px}
.gate-card h2{font-size:20px;font-weight:800;color:var(--navy);margin:0 0 10px}
.gate-card p{font-size:14px;color:var(--ink-soft);line-height:1.75;max-width:480px;margin:0 auto 20px}
.gate-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:11px;
  font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;text-decoration:none;border:none;
}
.btn-gold{background:linear-gradient(135deg,#C9A84C,#E8C96A);color:#0D1B2A}
.btn-navy{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.btn-ghost{background:#eff3ff;color:var(--navy);border:1px solid #bfcfef}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:18px 0}
.meta-item{padding:12px 14px;border-radius:12px;background:#f8f6f0;border:1px solid var(--line)}
.meta-item .lbl{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.meta-item .val{font-size:14px;font-weight:800;color:var(--navy)}
.detail-title{font-family:'Amiri',Georgia,serif;font-size:clamp(20px,2.8vw,28px);font-weight:700;color:var(--ink);margin:0 0 8px;line-height:1.4}
.detail-cat{display:inline-flex;padding:4px 12px;border-radius:10px;font-size:11.5px;font-weight:800;color:var(--gold-dk);background:rgba(201,168,76,.13);margin-bottom:14px}
.detail-desc{font-size:14.5px;line-height:1.85;color:#2a3448;white-space:pre-wrap;margin:8px 0 18px}
.section-lbl{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.3px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.contacts{padding:14px;border-radius:12px;background:#f8f6f0;border:1px solid var(--line);font-size:13px}
.contacts.locked .blur{filter:blur(5px);user-select:none;color:transparent;text-shadow:0 0 8px rgba(80,80,80,.5)}
.contact-row{display:flex;gap:8px;margin-top:6px;color:var(--ink-soft)}
.banner{margin-bottom:16px;padding:12px 16px;border-radius:12px;font-size:12.5px;line-height:1.65;font-weight:600}
.banner.info{background:#eff6ff;border:1.5px solid #bfdbfe;color:#1e40af}
.banner.warn{background:#fffbeb;border:1.5px solid #fcd34d;color:#92400e}
.loading{text-align:center;padding:40px;color:var(--ink-soft);font-weight:700}
@media(max-width:640px){.detail-hero{padding:28px 4% 22px}.gate-card,.detail-card{padding:22px 16px}}
</style>
<script src="rizq_pwa.js?v=31.20" defer></script>
</head>
<body>
<nav class="topnav"><div class="topnav-inner"></div></nav>

<section class="detail-hero">
  <div class="detail-hero-inner">
    <div class="detail-kicker" id="dh-kicker">RIZQ · غرفة تفاصيل المناقصة</div>
    <h1 id="dh-title">تفاصيل المناقصة</h1>
    <p id="dh-sub">للمشتركين في باقة المناقصات — بيانات كاملة عن المناقصة وصاحبها.</p>
    <div class="detail-crumb">
      <a href="rizq_tenders_directory.html" id="link-dir">← دليل المناقصات</a>
      <a href="rizq_tenders.html?demo=1" id="link-submit">غرفة الإرسال</a>
    </div>
  </div>
</section>

<div class="wrap">
  <div id="banner"></div>
  <div id="main"><div class="loading" id="loading">جاري التحميل…</div></div>
</div>

<script src="rizq_backend_config.js"></script>
<script src="rizq_site_banner.js"></script>
<script src="rizq_disclaimer.js"></script>
<script src="rizq_i18n_data.js"></script>
<script src="rizq_i18n.js"></script>
<script src="rizq_lang_guard.js?v=1.0"></script>
<script src="rizq_module_flags.js"></script>
<script src="rizq_header.js"></script>
<script>
function _lang(){ try{ return localStorage.getItem('rizq_lang')||'ar'; }catch(e){ return 'ar'; } }
function _fr(){ return _lang()==='fr'; }
function _base(){ return (typeof window.RIZQ_BACKEND_BASE==='string' && window.RIZQ_BACKEND_BASE) || 'http://localhost:3000'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function _params(){ return new URLSearchParams(location.search); }
function _isDemo(){ return _params().get('demo')==='1'; }
function _id(){ return String(_params().get('id')||'').trim(); }
function _getSession(){ try{ return JSON.parse(localStorage.getItem('rizq_active_session')||'null'); }catch(e){ return null; } }

window.REAL_ACCESS_TOKEN = null;
function _resolveToken(session){
  if(window.REAL_ACCESS_TOKEN) return Promise.resolve(window.REAL_ACCESS_TOKEN);
  try{
    var accs = JSON.parse(localStorage.getItem('rizq_pending_accounts')||'[]');
    var rec = accs.find(function(a){ return a.id===session.id; });
    if(rec && (rec.backendAccessToken || rec.accessToken)){
      window.REAL_ACCESS_TOKEN = rec.backendAccessToken || rec.accessToken;
      return Promise.resolve(window.REAL_ACCESS_TOKEN);
    }
  }catch(e){}
  if(!_base() || !session || !session.token) return Promise.resolve(null);
  return fetch(_base() + '/api/accounts/verify-dash/' + encodeURIComponent(session.id), {
    method:'POST',
    headers:{'Content-Type':'application/json','x-dash-token':session.token},
    body:JSON.stringify({dashToken:session.token})
  }).then(function(r){ return r.ok ? r.json() : null; }).then(function(data){
    if(!data || !data.ok || !data.account || !data.account.accessToken) return null;
    window.REAL_ACCESS_TOKEN = data.account.accessToken;
    return window.REAL_ACCESS_TOKEN;
  }).catch(function(){ return null; });
}

function _fmtDate(iso, fr){
  try{
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso||'—');
    return d.toLocaleDateString(fr?'fr-FR':'ar-EG-u-nu-latn', { year:'numeric', month:'short', day:'numeric' });
  }catch(e){ return String(iso||'—'); }
}

function _demoTender(fr){
  return {
    id: 'demo',
    title: fr ? 'Appel d\'offres modèle — fournitures' : 'مناقصة توريد نموذجية',
    desc: fr
      ? 'Description détaillée de l\'appel d\'offres modèle : quantités, délais, conditions de livraison et critères d\'évaluation.'
      : 'وصف تفصيلي للمناقصة النموذجية: الكميات، المواعيد، شروط التسليم ومعايير التقييم.',
    category: fr ? 'Fournitures' : 'توريد ومعدات',
    city: fr ? 'Nouakchott' : 'نواكشوط',
    budgetMin: 500000,
    budgetMax: 1200000,
    deadline: new Date(Date.now()+20*86400000).toISOString(),
    createdAt: new Date(Date.now()-3*86400000).toISOString(),
    ownerName: fr ? 'Organisme démo' : 'جهة ترويجية',
    ownerPhone: '••••••••',
    ownerEmail: '••••@••••.••',
    contactsLocked: true,
    bidsCount: 3,
    status: 'open'
  };
}

function renderGate(kind){
  var fr = _fr();
  var main = document.getElementById('main');
  var banner = document.getElementById('banner');
  banner.innerHTML = '';
  var title, body, actions;
  if(kind === 'login'){
    title = fr ? 'Connexion requise' : 'يلزم تسجيل الدخول';
    body = fr
      ? 'Connectez-vous depuis votre tableau de bord, puis ouvrez cette page avec une offre d\'abonnement active.'
      : 'سجّل دخولك من لوحة التحكم، ثم افتح هذه الصفحة باشتراك فعّال في باقة المناقصات.';
    actions = '<a class="btn btn-gold" href="rizq_landing_v8.html">'+(fr?'Aller au tableau de bord':'الذهاب إلى لوحة التحكم')+'</a>'
      + '<a class="btn btn-ghost" href="rizq_tenders_directory.html">'+(fr?'Retour à l\'annuaire':'العودة للدليل')+'</a>';
  } else if(kind === 'package'){
    title = fr ? 'Abonnement requis' : 'يلزم اشتراك باقة المناقصات';
    body = fr
      ? 'La salle de détail est réservée aux abonnés. Activez une offre d\'appels d\'offres depuis votre tableau de bord (Abonnement).'
      : 'غرفة التفاصيل للمشتركين فقط. فعّل باقة المناقصات من لوحة التحكم ← اشتراكي.';
    actions = '<a class="btn btn-gold" href="rizq_landing_v8.html#pricing">'+(fr?'Voir les forfaits':'عرض الباقات')+'</a>'
      + '<a class="btn btn-ghost" href="rizq_tenders_directory.html">'+(fr?'Retour à l\'annuaire':'العودة للدليل')+'</a>';
  } else {
    title = fr ? 'Appel d\'offres introuvable' : 'المناقصة غير موجودة';
    body = fr ? 'Cette opportunité n\'est plus disponible ou a été retirée.' : 'هذه المناقصة غير متاحة أو أُزيلت.';
    actions = '<a class="btn btn-navy" href="rizq_tenders_directory.html">'+(fr?'Voir l\'annuaire':'عرض الدليل')+'</a>';
  }
  main.innerHTML = '<div class="gate-card"><div class="ico">🔒</div><h2>'+esc(title)+'</h2><p>'+esc(body)+'</p><div class="gate-actions">'+actions+'</div></div>';
}

function renderDetail(t, access){
  var fr = _fr();
  var main = document.getElementById('main');
  var banner = document.getElementById('banner');
  var unlocked = !!(access && access.contactsUnlocked);
  var trial = !!(access && access.isTrial);
  if(_isDemo()){
    banner.innerHTML = '<div class="banner info">👁 '+(fr
      ? 'Mode modèle — aperçu de la salle de détail. <a href="rizq_landing_v8.html#pricing" style="font-weight:800;color:inherit">Abonnez-vous</a>'
      : 'وضع نموذج — معاينة غرفة التفاصيل. <a href="rizq_landing_v8.html#pricing" style="font-weight:800;color:inherit">اشترك للدخول الحقيقي</a>')+'</div>';
  } else if(unlocked){
    banner.innerHTML = '<div class="banner info">✅ '+(fr?'Abonnement actif — contacts débloqués.':'اشتراك فعّال — بيانات التواصل مكشوفة.')+'</div>';
  } else if(trial){
    banner.innerHTML = '<div class="banner warn">🔍 '+(fr?'Essai actif — détails visibles, contacts verrouillés.':'تجريبية فعّالة — التفاصيل ظاهرة والتواصل مقفول.')+'</div>';
  } else {
    banner.innerHTML = '';
  }

  document.getElementById('dh-title').textContent = t.title || (fr?'Appel d\'offres':'مناقصة');

  var budget = '';
  if(t.budgetMax > 0 || t.budgetMin > 0){
    budget = (Number(t.budgetMin||0).toLocaleString()) + ' – ' + (Number(t.budgetMax||0).toLocaleString()) + ' MRU';
  }
  var phone = unlocked ? (t.ownerPhone || '—') : '••• ••• •••';
  var email = unlocked ? (t.ownerEmail || '—') : '•••@•••.•••';
  var wa = unlocked ? (t.ownerWhatsApp || t.ownerPhone || '—') : (fr?'Masqué':'مخفي');

  main.innerHTML = '<article class="detail-card">'
    + '<span class="detail-cat">📑 '+esc(t.category|| (fr?'Catégorie':'فئة'))+'</span>'
    + '<h2 class="detail-title">'+esc(t.title||'')+'</h2>'
    + '<div class="meta-grid">'
    + '<div class="meta-item"><div class="lbl">'+(fr?'Donneur d\'ordre':'صاحب المناقصة')+'</div><div class="val">'+esc(t.ownerName||'—')+'</div></div>'
    + '<div class="meta-item"><div class="lbl">'+(fr?'Wilaya / ville':'الولاية / المدينة')+'</div><div class="val">'+esc(t.city||'—')+'</div></div>'
    + '<div class="meta-item"><div class="lbl">'+(fr?'Date limite':'آخر أجل')+'</div><div class="val">'+esc(_fmtDate(t.deadline, fr))+'</div></div>'
    + '<div class="meta-item"><div class="lbl">'+(fr?'Publié le':'تاريخ النشر')+'</div><div class="val">'+esc(_fmtDate(t.createdAt, fr))+'</div></div>'
    + (budget ? '<div class="meta-item"><div class="lbl">'+(fr?'Budget':'الميزانية')+'</div><div class="val">'+esc(budget)+'</div></div>' : '')
    + '<div class="meta-item"><div class="lbl">'+(fr?'Offres reçues':'العروض الواردة')+'</div><div class="val">'+esc(String(t.bidsCount!=null?t.bidsCount:0))+'</div></div>'
    + '</div>'
    + '<div class="section-lbl">'+(fr?'Description complète':'الوصف الكامل')+'</div>'
    + '<div class="detail-desc">'+esc(t.desc|| (fr?'Aucune description.':'لا يوجد وصف.'))+'</div>'
    + '<div class="section-lbl">'+(fr?'Coordonnées':'بيانات التواصل')+(unlocked?'':' 🔒')+'</div>'
    + '<div class="contacts'+(unlocked?'':' locked')+'">'
    + '<div class="contact-row"><span>📞</span><span class="'+(unlocked?'':'blur')+'">'+esc(phone)+'</span></div>'
    + '<div class="contact-row"><span>✉️</span><span class="'+(unlocked?'':'blur')+'">'+esc(email)+'</span></div>'
    + '<div class="contact-row"><span>💬</span><span class="'+(unlocked?'':'blur')+'">'+esc(wa)+'</span></div>'
    + (!unlocked ? '<p style="margin-top:10px;font-size:12px;color:#92400e">'+(fr?'Passez à une offre payante pour débloquer les contacts.':'رقِّ الباقة لكشف التواصل.')+'</p>' : '')
    + '</div>'
    + '<div class="gate-actions" style="margin-top:22px">'
    + '<a class="btn btn-ghost" href="rizq_tenders_directory.html">'+(fr?'← Annuaire':'← الدليل')+'</a>'
    + (unlocked ? '<a class="btn btn-navy" href="rizq_tenders.html">'+(fr?'Soumettre une offre':'تقديم عرض')+'</a>' : '')
    + '</div>'
    + '</article>';
}

function applyHeroLang(){
  var fr = _fr();
  document.getElementById('dh-kicker').textContent = fr ? 'RIZQ · Salle de détail — Appel d\'offres' : 'RIZQ · غرفة تفاصيل المناقصة';
  document.getElementById('dh-sub').textContent = fr
    ? 'Réservée aux abonnés — détails complets (porteur, dates, budget, contacts).'
    : 'للمشتركين في باقة المناقصات — بيانات كاملة عن المناقصة وصاحبها.';
  document.getElementById('link-dir').textContent = fr ? '← Annuaire des appels d\'offres' : '← دليل المناقصات';
  document.getElementById('link-submit').textContent = fr ? 'Salle de publication' : 'غرفة الإرسال';
  document.title = fr ? 'Détail appel d\'offres — Rizq' : 'تفاصيل المناقصة — رزق';
  var loading = document.getElementById('loading');
  if(loading) loading.textContent = fr ? 'Chargement…' : 'جاري التحميل…';
}

function boot(){
  applyHeroLang();
  if(_isDemo() && !_id()){
    renderDetail(_demoTender(_fr()), { contactsUnlocked:false, isTrial:true, subscribed:true });
    return;
  }
  var id = _id();
  if(!id){
    renderGate('missing');
    return;
  }
  var session = _getSession();
  if(!session){
    renderGate('login');
    return;
  }
  _resolveToken(session).then(function(tok){
    var headers = { 'x-account-id': session.id, 'x-account-token': tok || session.token || '' };
    return fetch(_base().replace(/\/$/,'') + '/api/tenders/package/status/' + encodeURIComponent(session.id), { headers: headers })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(pkg){
        if(!pkg || !pkg.ok || !pkg.subscribed){
          renderGate('package');
          return null;
        }
        return fetch(_base().replace(/\/$/,'') + '/api/tenders/' + encodeURIComponent(id), { headers: headers })
          .then(function(r){
            if(r.status === 404){ renderGate('missing'); return null; }
            return r.ok ? r.json() : null;
          })
          .then(function(data){
            if(!data) return;
            if(!data.ok || !data.tender){ renderGate('missing'); return; }
            renderDetail(data.tender, data.access || {
              contactsUnlocked: !!pkg.contactsUnlocked,
              isTrial: !!pkg.isTrial,
              subscribed: true
            });
          });
      });
  }).catch(function(){ renderGate('package'); });
}

document.addEventListener('rizq:langchange', function(){ boot(); });
boot();
</script>
<script src="rizq_video_ads.js"></script>
