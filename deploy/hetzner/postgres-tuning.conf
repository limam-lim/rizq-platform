# تضمين من postgresql.conf على خادم 8GB RAM / 4 أنوية
# مثال: include = '/opt/rizq/deploy/hetzner/postgres-tuning.conf'

# ذاكرة
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 256MB
work_mem = 16MB
wal_buffers = 64MB

# نقاط تفتيش وكتابة
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# توازي
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# اتصالات (Node pool منفصل)
max_connections = 100

# إحصاءات مخطط
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# تسجيل معتدل
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
