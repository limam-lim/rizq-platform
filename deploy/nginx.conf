# Rizq reverse proxy — static frontend + API + uploads
# Domains: rizq.mr / www.rizq.mr / rizqsmart.com / www.rizqsmart.com

upstream rizq_api {
    server api:3000;
    keepalive 32;
}

# Redirect bare hosts / www variants can be terminated at TLS edge;
# this server block serves HTTP (and HTTPS if certs are mounted).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name rizq.mr www.rizq.mr rizqsmart.com www.rizqsmart.com localhost;

    # Max body aligned with Express 20mb JSON + margin
    client_max_body_size 25m;
    client_body_timeout 60s;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/json application/javascript
        application/xml image/svg+xml font/woff2;

    # Security headers (API also sets its own)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Rizq-Platform "Rizq-ADMINIA-SARL" always;

    root /usr/share/nginx/html;
    index index.html rizq_landing_v8.html;

    # Health passthrough
    location = /health {
        proxy_pass http://rizq_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Backend API
    location /api/ {
        proxy_pass http://rizq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded media (shared volume with API)
    location /uploads/ {
        alias /var/rizq/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Static site assets
    location / {
        try_files $uri $uri/ /index.html;
        # HTML short cache; hashed assets longer if present
        location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }
    }

    # Deny hidden / sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|md|sql|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

