# Minimal reverse proxy for Rizq (static + /api → api:3000)
upstream rizq_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 32m;

  location /api/ {
    proxy_pass http://rizq_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location /health {
    proxy_pass http://rizq_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /uploads/ {
    alias /var/rizq/uploads/;
    expires 7d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ /rizq_landing_v8.html;
  }
}
