# Minimal reverse proxy for Rizq (static + /api → api:3000)
upstream rizq_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 32m;

  location /api/ {
    proxy_pass http://rizq_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location /health {
    proxy_pass http://rizq_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # الملفات المرفوعة تمر عبر الخادم (فحوص KYC/الإيصالات/المناقصات) — لا تُخدم من القرص مباشرة
  location /uploads/ {
    proxy_pass http://rizq_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
  }

  # لا تُخدم أبداً: ملفات مخفية (.env/.git) ومجلدات الخادم والتشغيل
  location ~ /\. { deny all; return 404; }
  location ~ ^/(rizq-backend|backups|deploy|docs|scripts|qa|node_modules)(/|$) { deny all; return 404; }
  location ~ \.(md|yml|yaml|sh|bat|ps1|env|log|sqlite|db|lock)$ { deny all; return 404; }
  location ~ ^/(package(-lock)?\.json|render\.yaml|docker-compose.*|Dockerfile)$ { deny all; return 404; }

  location / {
    try_files $uri $uri/ /rizq_landing_v8.html;
  }
}
