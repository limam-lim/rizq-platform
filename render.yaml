# نشر خادم رزق (rizq-backend) على Render — مرة واحدة من لوحة Render:
# Dashboard → New → Blueprint → اختر مستودع rizq-platform
services:
  - type: web
    name: rizq-platform-api
    runtime: node
    rootDir: rizq-backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://limam-lim.github.io,https://rizq.mr,https://www.rizq.mr
      - key: OTP_ALLOW_DEMO
        value: "false"
      - key: SUPER_ADMIN_EMAIL
        value: megalimam@gmail.com
      - key: SUPER_ADMIN_NAME
        value: M. LIMAM
      # أسرار — تُدخل من Render Dashboard → Environment (لا تُرفع للمستودع):
      - key: SUPER_ADMIN_PASS_HASH
        sync: false
      - key: ADMIN_PANEL_PATH
        sync: false
      - key: ADMIN_PANEL_GATE_KEY
        sync: false
      - key: BACKEND_SHARED_SECRET
        sync: false
      - key: RIZQ_API_SECRET
        sync: false
      # أضف يدوياً أيضاً عند الحاجة:
      # ANTHROPIC_API_KEY, EMAIL_USER, EMAIL_PASS, OTP_PEPPER
