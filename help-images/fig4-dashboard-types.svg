    <rect x="240" y="50" width="190" height="100" rx="14" fill="#fffbeb" stroke="#C9A84C" stroke-width="2"/>
    <text x="335" y="90" fill="#a07820" font-size="22" font-weight="800">م</text>
    <text x="335" y="118" fill="#1B3A6B" font-size="15" font-weight="700">محل</text>
