<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" role="img" aria-label="account types">
  <rect width="880" height="180" rx="14" fill="#ffffff"/>
